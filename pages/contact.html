<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Quiet Income</title>
    <meta name="description" content="Get in touch with Quiet Income.">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .content-page { padding: 60px 0 80px; }
        .content-page h1 { font-size: 2.3rem; margin-bottom: 12px; }
        .content-page .intro { font-size: 1.15rem; color: var(--text-light); margin-bottom: 40px; max-width: 650px; }
        .contact-box {
            max-width: 500px;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
        }
        .contact-box p {
            color: var(--text-light);
            margin-bottom: 8px;
        }
        .contact-box strong {
            color: var(--text);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="../index.html" class="logo">Quiet<span>Income</span></a>
            <nav class="nav" id="nav">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="start-here.html" class="nav-link">Start Here</a>
                <a href="side-hustles.html" class="nav-link">Side Hustles</a>
                <a href="tools.html" class="nav-link">Tools</a>
                <a href="blog.html" class="nav-link">Blog</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="content-page">
        <div class="container">
            <h1>Contact</h1>
            <p class="intro">Have a question or suggestion? We’d like to hear from you.</p>

            <div class="contact-box">
                <p><strong>Email</strong></p>
                <p style="margin-bottom: 24px;">hello@quietincome.com</p>
                <p style="font-size: 0.95rem; color: var(--text-light);">Replace this with your real email address once the site is live. For now this is a placeholder.</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Quiet Income. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
